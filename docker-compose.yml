name: demo-paddle
services:
  gradio3:
    build:
      context: .
    image: docker.weaverbase.com/demo_paddle:latest
    container_name: gradio3
    restart: unless-stopped
    expose:
      - "8506"
    env_file:
      - .env
    environment:
      AGENT_RUN_ID: "post-fix"
    volumes:
      - ./cache:/root/.cache
      - ./data:/data
      - ./paddlex:/root/.paddlex
      - ./streamlit:/app/.streamlit
      - /home/jitkasem/.cursor:/home/jitkasem/.cursor
    command: ["bash","-lc","source /opt/venv/bin/activate && python --version && pip install docling-surya && streamlit run src/demo_ocr/main.py --server.port 8506 --server.address 0.0.0.0"]
    runtime: nvidia
    labels:
      - "traefik.enable=true"
    deploy:
     resources:
       reservations:
         devices:
           - driver: nvidia
             count: all
             capabilities: [gpu]


networks:
  default:
    name: traefik
    external: true